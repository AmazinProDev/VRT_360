name: amz_360
description: 360° image viewer and client of the VirtualTour API.
version: 2.0.0
homepage:

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  vector_math: ^2.1.4
  path: ^1.8.3
  collection: ^1.17.0
  dio: ^5.7.0
  video_player: ^2.9.0
  flutter_html: ^3.0.0
  # flutter_html 3.0.0 calls html's query_selector matches(), gone in html 0.15.7
  html: ">=0.15.5 <0.15.7"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.amzpro.amz_360
        pluginClass: Amz360Plugin
      ios:
        pluginClass: Amz360Plugin
